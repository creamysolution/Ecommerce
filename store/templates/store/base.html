<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Store{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #f8f9fa; }
        .main-content { flex: 1; }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; border: none; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .product-img-container { height: 220px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
        .product-img-container img { max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'store:product_list' %}">
                <i class="bi bi-bag-check-fill text-warning me-2"></i>ModernShop
            </a>
            <div class="d-flex align-items-center ms-auto">
                <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 me-1"></i> Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        {{ cart|length }}
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container my-5 main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 ModernShop. Built with Django and Bootstrap.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
